name: Publish VS Code extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const v = require("./package.json").version; if (process.env.RELEASE_TAG !== `v${v}` || !/^\d+\.\d+\.\d+$/.test(v)) { throw new Error(`Expected stable tag v${v}, got ${process.env.RELEASE_TAG}`); }'
      - run: npm test
      - run: npm run test:marketplace-stats
      - run: npm run test:curl-semantic
      - run: npm run test:dto-compile
      - run: node src/test/scripts/test-sample.js
      - run: node src/test/scripts/test-all-files.js
      - run: node src/test/scripts/test-copy-url-curl.js
      - run: node src/test/scripts/test-parameter-copy.js
      - name: Package VSIX
        run: npx --yes @vscode/vsce@4.1.0 package --out extension.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: extension.vsix
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath extension.vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" extension.vsix
          else
            gh release create "$RELEASE_TAG" extension.vsix --verify-tag --generate-notes
          fi
